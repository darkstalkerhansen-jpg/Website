<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Falcon Browser</title>
        <link rel="stylesheet" href="FALCON2.css">
          <style>
              .redirect-container { margin-top: 20px; text-align: center; z-index: 10; }
                  .timer-text { color: #718093; font-size: 0.9rem; margin-bottom: 10px; }
                      #timer-count { color: #e67e22; font-weight: bold; }
                          .falcon-btn { padding: 10px 20px; background: #2d3436; color: #f39c12; border: 1px solid #4a5568; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
                            </style>
                            </head>
                            <body>

                              <!-- (Insert your existing Wind Layer and SVG SVG title-wrapper code here) -->

                                <div class="redirect-container">
                                    <p class="timer-text">Launching target in <span id="timer-count">5</span>s</p>
                                        <!-- The link is now empty; JS will fill it or trigger it -->
                                            <a href="#" id="autoRedirectBtn" class="falcon-btn">Manual Launch</a>
                                              </div>

                                                <div style="text-align:center; margin-top:20px;">
                                                    <input type="text" id="searchquery" class="button" placeholder="search the web">
                                                        <button class="button" onclick="search()">press to search</button>
                                                            <p><iframe src="Falcon.html" id="IBig" style="width:80%; height:300px; border:1px solid #4a5568;"></iframe></p>
                                                              </div>

                                                                <script>
                                                                    // 1. The target link you want to reach
                                                                        const targetBase64 = "aHR0cHM6Ly9kYXJrc3RhbGtlcmhhbnNlbi1qcGcuZ2l0aHViLmlvL1dlYnNpdGUvaW5kZXguaHRtbA==";
                                                                            const finalUrl = atob(targetBase64); // Decodes base64 in the browser

                                                                                // 2. Set the button link immediately
                                                                                    const launchBtn = document.getElementById('autoRedirectBtn');
                                                                                        launchBtn.href = finalUrl;

                                                                                            // 3. 5-Second Auto-Redirect
                                                                                                let secondsLeft = 5;
                                                                                                    const countdown = setInterval(() => {
                                                                                                            secondsLeft--;
                                                                                                                    document.getElementById('timer-count').textContent = secondsLeft;

                                                                                                                            if (secondsLeft <= 0) {
                                                                                                                                        clearInterval(countdown);
                                                                                                                                                    window.location.href = finalUrl; // Redirects the current page
                                                                                                                                                            }
                                                                                                                                                                }, 1000);

                                                                                                                                                                    // 4. Search Function
                                                                                                                                                                        function search() {
                                                                                                                                                                                const query = document.getElementById("searchquery").value;
                                                                                                                                                                                        if(query) window.open('https://google.com' + encodeURIComponent(query), '_blank');
                                                                                                                                                                                            }
                                                                                                                                                                                              </script>
                                                                                                                                                                                              </body>
                                                                                                                                                                                              </html>
